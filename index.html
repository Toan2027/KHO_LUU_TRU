<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Học Toán Qua Web</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            text-align: center;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #2c3e50;
            margin-top: 30px;
            font-size: 28px;
        }
        .subtitle {
            color: #7f8c8d;
            font-size: 16px;
            margin-bottom: 30px;
        }
        .container {
            max-width: 450px;
            margin: 0 auto;
            padding: 10px;
        }
        .btn {
            display: block;
            color: white;
            padding: 16px;
            margin: 16px 0;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }
        /* Cấu hình màu sắc bắt mắt cho từng khối lớp */
        .btn-6 { background-color: #2ecc71; } /* Màu xanh lá */
        .btn-6:hover { background-color: #27ae60; }
        
        .btn-7 { background-color: #f1c40f; } /* Màu vàng */
        .btn-7:hover { background-color: #f39c12; }
        
        .btn-8 { background-color: #e67e22; } /* Màu cam */
        .btn-8:hover { background-color: #d35400; }
        
        .btn-9 { background-color: #e74c3c; } /* Màu đỏ */
        .btn-9:hover { background-color: #c0392b; }
    </style>
</head>
<body>

        <a href="#" class="nút nút-9">📚 Học Toán Lớp 9</a>

</body>
</html>
